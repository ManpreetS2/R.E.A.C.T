name: analysis-checks

on:
  push:
  pull_request:

jobs:
  analysis:
    name: analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install analysis test dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy scipy matplotlib pytest
      - name: Run analysis tests
        run: python -m pytest tests/analysis -q
        env:
          PYTHONPATH: src
          MPLBACKEND: Agg
