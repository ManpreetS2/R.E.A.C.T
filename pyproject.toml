[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rewardbench"
version = "0.1.0"
description = "In-context reward-driven LLM adaptation benchmark. Compares how models adapt from numerical rewards without weight updates."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rewardbench = ["py.typed", "storage/schema.sql", "providers/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/core"]
addopts = "-q"
