[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rewardbench"
version = "0.1.0"
description = "In-context reward-driven LLM adaptation benchmark. Compares how models adapt from numerical rewards without weight updates."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
analysis = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]
environments = [
    "gymnasium[box2d]>=1.0",
    "numpy>=1.26",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]
blindplay = [
    "playwright==1.64.1",
    "Pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rewardbench = ["py.typed", "storage/schema.sql", "providers/data/*.json", "blindplay/clock.js", "blindplay/player_runtime/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/core", "tests/analysis"]
addopts = "-q --import-mode=importlib"
