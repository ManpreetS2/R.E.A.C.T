<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ApolloLander game.js collision parity bridge</title>
  <!--
    Loads UNMODIFIED upstream Lander/Landscape, then injects the LITERAL
    checkCollisions / setLanded / setCrashed / pointIsLessThanLine source
    extracted from upstream/game.js (fetched at runtime). This verifies the
    PR #4 helper copies against real game.js logic running in Chromium.
    This file lives OUTSIDE upstream/; upstream/ is never modified.
  -->
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="../upstream/perlin.js"></script>
  <script src="../upstream/libs/Vector2.js"></script>
  <script src="../upstream/libs/rAF.js"></script>
  <script>
    var TO_RADIANS = Math.PI / 180;
    var counter = 0;
    var SCREEN_WIDTH = 800, SCREEN_HEIGHT = 600;
    var singlePlayMode = false;
    var score = 0;
    var gameState = 1;
    var PLAYING = 1, LANDED = 2, CRASHED = 3, GAMEOVER = 4, WAITING = 0;
    function clamp(value, min, max) {
      return value < min ? min : value > max ? max : value;
    }
    function map(value, min1, max1, min2, max2, doClamp) {
      if (doClamp) {
        if (value <= min1) return min2;
        if (value >= max1) return max2;
      }
      return ((value - min1) / (max1 - min1)) * (max2 - min2) + min2;
    }
    function setThrustVolume() {}
    var samples = { beep: { play: function(){} }, explosion: { play: function(){} } };
    var infoDisplay = {
      showGameInfo: function() { return false; },
      hideGameInfo: function() {},
      updateBoxInt: function() {},
      updateBoxTime: function() {},
      arrangeBoxes: function() {},
      domElement: { style: {} }
    };
    function sendLanded() {}
    function sendCrashed() {}
    function sendGameOver() {}
    function sendRestart() {}
    function scheduleRestart() {}
    function setGameOver() {
      gameState = GAMEOVER;
      sendGameOver();
    }
    // Deterministic RNG so crash fuel penalty path is reproducible for score checks.
    (function() {
      var s = 0xc0ffee;
      Math.random = function() {
        s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
        return ((s >>> 0) % 1000000) / 1000000;
      };
      Math.__rl_seed = function(seed) { s = seed >>> 0 || 0xc0ffee; };
    })();
  </script>
  <script src="../upstream/Lander.js"></script>
  <script src="../upstream/Landscape.js"></script>
  <script>
    var lander = new Lander();
    var landscape = new Landscape();
    var lastNativeOutcome = null;
    var targetRotation = -90;
    var stepCount = 0;
    var status = "flying";
    var done = false;
    var zone = null;
    var gameJsSourceLoaded = false;
    var gameJsExtractMeta = null;

    (function pickZone() {
      var best = null;
      for (var i = 0; i < landscape.lines.length; i++) {
        var line = landscape.lines[i];
        if (!line.landable) continue;
        var width = line.p2.x - line.p1.x;
        if (width < 12) continue;
        if (!best || width > best.width) best = { width: width, line: line };
      }
      best.line.multiplier = Math.max(best.line.multiplier, 2);
      best.line.designated = true;
      zone = best.line;
    })();

    function observe() {
      var mid = (zone.p1.x + zone.p2.x) / 2;
      return {
        x: lander.pos.x, y: lander.pos.y,
        vx: lander.vel.x, vy: lander.vel.y,
        rotation: lander.rotation, fuel: lander.fuel,
        altitude: lander.altitude, thrust: lander.thrustLevel,
        thrustBuild: lander.thrustLevel,
        zoneLeft: zone.p1.x, zoneRight: zone.p2.x, zoneY: zone.p1.y,
        dx: mid - lander.pos.x, dy: zone.p1.y - lander.pos.y,
        step: stepCount, status: status, targetRotation: targetRotation,
        active: lander.active, scale: lander.scale, score: score
      };
    }

    function applyStart(start) {
      lander.reset();
      lander.scale = start.scale;
      lander.pos.reset(start.x, start.y);
      lander.vel.reset(start.vx, start.vy);
      lander.rotation = start.rotation;
      lander.setRotation(start.rotation);
      lander.rotation = start.rotation;
      targetRotation = start.rotation;
      lander.fuel = start.fuel;
      lander.active = true;
      lander.thrust(0);
      lander.left = lander.pos.x - 10 * lander.scale;
      lander.right = lander.pos.x + 10 * lander.scale;
      lander.bottom = lander.pos.y + 13 * lander.scale;
      lander.top = lander.pos.y - 5 * lander.scale;
      lander.bottomLeft.reset(lander.left, lander.bottom);
      lander.bottomRight.reset(lander.right, lander.bottom);
    }

    function wrapGameJsTerminals() {
      // After injecting literal game.js functions, wrap setLanded/setCrashed
      // to record research-native outcomes without changing their decision logic.
      var _setLanded = setLanded;
      var _setCrashed = setCrashed;
      setLanded = function(line) {
        var vyAtContact = lander.vel.y;
        var rotAtContact = lander.rotation;
        var scoreBefore = score;
        var fuelBefore = lander.fuel;
        _setLanded(line);
        var pointsAdded = score - scoreBefore;
        var mult = line.multiplier;
        // game.js: perfect iff vel.y < 0.075 at decision time (also +50 fuel).
        var perfect = vyAtContact < 0.075;
        if (pointsAdded === 50 * mult) perfect = true;
        if (pointsAdded === 15 * mult) perfect = false;
        if (lander.fuel > fuelBefore) perfect = true;
        lastNativeOutcome = {
          kind: "landed",
          perfect: perfect,
          hard: !perfect,
          nativePoints: pointsAdded,
          multiplier: mult,
          designated: mult > 1,
          vy: vyAtContact,
          rotation: rotAtContact
        };
      };
      setCrashed = function() {
        var vyAtContact = lander.vel.y;
        var rotAtContact = lander.rotation;
        _setCrashed();
        lastNativeOutcome = {
          kind: "crashed",
          perfect: false,
          hard: false,
          nativePoints: 0,
          multiplier: 1,
          designated: false,
          vy: vyAtContact,
          rotation: rotAtContact
        };
      };
    }

    function extractFunction(source, name) {
      var marker = "function " + name;
      var start = source.indexOf(marker);
      if (start < 0) throw new Error("failed to find " + name + " in game.js");
      var brace = source.indexOf("{", start);
      if (brace < 0) throw new Error("no body for " + name);
      var depth = 0;
      for (var i = brace; i < source.length; i++) {
        var ch = source.charAt(i);
        if (ch === "{") depth++;
        else if (ch === "}") {
          depth--;
          if (depth === 0) {
            var end = i + 1;
            if (source.charAt(end) === ";") end++;
            return source.slice(start, end);
          }
        }
      }
      throw new Error("unbalanced braces for " + name);
    }

    async function loadRealGameJsCollisions() {
      var resp = await fetch("../upstream/game.js");
      if (!resp.ok) throw new Error("fetch game.js failed: " + resp.status);
      var source = await resp.text();
      var names = ["pointIsLessThanLine", "setLanded", "setCrashed", "checkCollisions"];
      var parts = [];
      var lengths = {};
      for (var i = 0; i < names.length; i++) {
        var fn = extractFunction(source, names[i]);
        lengths[names[i]] = fn.length;
        parts.push(fn);
      }
      // eslint-disable-next-line no-eval
      (0, eval)(parts.join("\n"));
      if (typeof setLanded !== "function" || typeof checkCollisions !== "function") {
        throw new Error("game.js collision functions failed to install");
      }
      wrapGameJsTerminals();
      gameJsSourceLoaded = true;
      gameJsExtractMeta = { functions: lengths, bytes: source.length, source: "upstream/game.js" };
    }

    window.__rl = {
      ready: false,
      engine: "browser_real_gamejs_collision_bridge",
      initPromise: loadRealGameJsCollisions().then(function() {
        window.__rl.ready = true;
        return gameJsExtractMeta;
      }),
      meta: function() { return gameJsExtractMeta; },
      reset: function(config) {
        if (!gameJsSourceLoaded) throw new Error("game.js collisions not loaded");
        Math.__rl_seed((config && config.rngSeed) || 0xc0ffee);
        var start = Object.assign({
          x: (zone.p1.x + zone.p2.x) / 2 - 160, y: 150, vx: 0.415, vy: 0,
          rotation: -90, fuel: 1000, scale: 0.25
        }, (config && config.start) || {});
        this._maxSteps = (config && config.maxSteps) || 8000;
        gameState = PLAYING; score = 0; stepCount = 0;
        status = "flying"; done = false; lastNativeOutcome = null;
        applyStart(start);
        return observe();
      },
      step: function(action) {
        if (done) {
          return {
            observation: observe(), done: true, status: status,
            nativeOutcome: lastNativeOutcome, nativeScore: score
          };
        }
        var thrust = Math.max(0, Math.min(1, Number(action.thrust) || 0));
        var rotation = Number(action.rotation);
        if (!isFinite(rotation)) rotation = targetRotation;
        rotation = Math.round(Math.max(-90, Math.min(90, rotation)) / 10) * 10;
        lander.setRotation(rotation);
        targetRotation = rotation;
        lander.thrust(lander.fuel > 0 ? thrust : 0);
        lander.update();
        stepCount += 1;
        counter = stepCount;
        lastNativeOutcome = null;
        if (lander.active) checkCollisions();
        if (lastNativeOutcome && status === "flying") {
          if (lastNativeOutcome.kind === "landed") {
            status = lastNativeOutcome.perfect ? "landed" : "hard_landing";
            done = true;
          } else if (lastNativeOutcome.kind === "crashed") {
            status = "crashed"; done = true;
          }
        } else if (stepCount >= this._maxSteps && status === "flying") {
          status = "timeout"; done = true; lander.active = false;
        }
        return {
          observation: observe(),
          done: done,
          status: status,
          nativeOutcome: lastNativeOutcome,
          nativeScore: score,
          applied: { thrust: thrust, rotation: rotation }
        };
      },
      observe: observe,
      mapInfo: function() {
        return {
          tileWidth: landscape.tileWidth,
          zone: { x1: zone.p1.x, x2: zone.p2.x, y: zone.p1.y, width: zone.p2.x - zone.p1.x },
          lineCount: landscape.lines.length,
          gameJs: gameJsExtractMeta
        };
      }
    };
  </script>
</body>
</html>
