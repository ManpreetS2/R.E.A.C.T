experiment_name: apollolander-offline-development-rewardonly
environment_id: apollolander
provider: mock
model_id: scripted-feedback-responsive
feedback_condition: reward_only
split: development
seed: 20261015
num_revisions: 2
episodes_per_revision: 1
history_window: 4
max_episode_steps: 120
max_model_retries: 0
checkpoint_every: 1
on_invalid_policy: skip
on_model_failure: abort
on_episode_failure: skip
database_path: runs/apollolander_offline_rewardonly.sqlite
budget:
  max_cost_usd: 1.0
  max_tokens: 100000
  max_wall_seconds: 1800
  max_revisions: 2
  max_episodes: 4
  max_model_calls: 8
development_seeds: [0, 1, 2, 3, 4, 5, 6, 7]
held_out_seeds: [1000000, 1000001, 1000002, 1000003, 1000004, 1000005, 1000006, 1000007]
model_settings:
  temperature: 0
metadata:
  environment_version: apollolander.env.v1
  task: apollolander
  purpose: offline_infrastructure_test
  not_llm_learning: true
  terrain: fixed-noise-seed-12039
  record_flights: true
  adapter_kwargs:
    research_mode: true
    max_steps: 120
    locked_camera: true
    start_schedule_version: apollolander.starts.v1
    vary_fuel: false
notes: >
  Offline mock experiment for the reward-only information control. Same seeds,
  revisions, and simulator parameters as the paired numerical and no-feedback
  configs; only feedback_condition and names differ. The prompt shows the scalar
  reward and nothing else (no success, steps, crashed, or simulator metrics), so
  comparing it with no_feedback isolates reward from richer outcome feedback.
  Scripted infrastructure test, not an LLM learning result. Kept separate from
  the completed offline v1 evidence (docs/REWARD_ONLY_CONTROL.md).
