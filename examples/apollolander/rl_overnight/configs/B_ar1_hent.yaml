# Family B: action_repeat=1, higher entropy, larger net.
family: B
reward_mode: research_shaped
observation_kind: "state-observation RL, not visual learning"

env:
  max_steps: 8000
  research_mode: true
  start_schedule_version: apollolander.starts.v1
  vary_fuel: false
  action_repeat: 1
  bonuses: false
  locked_camera: true

ppo:
  total_env_steps: 2000000
  n_envs: 4
  rollout_steps: 256
  learning_rate: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.15
  ent_coef: 0.08
  vf_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_size: 512
  hidden: 256
  seed: 5
  checkpoint_every_steps: 500000
  device: cpu
  train_seed_start: 10000
  train_seed_count: 200000
  run_name: B_ar1_hent_s5
